services:
  - type: web
    name: sichao-v2-server
    plan: free
    runtime: python
    rootDir: sichao-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sichao.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SICHAO_DB_PATH
        value: /tmp/sichao.db
