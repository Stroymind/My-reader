<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Zone：个人知识系统。">
<meta name="google" content="notranslate">
<title>Zone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
(function () {
  try {
    var p = localStorage.getItem('rr-appearance') || 'system';
    var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('appearance-dark');
    document.documentElement.dataset.appearance = p;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
</head>
<body class="theme-paper">
<section id="library" class="view active">
  <div class="shell">
    <div class="maincol">
      <header class="appbar">
        <div class="brand-row">
          <h1>Zone</h1>
          <div class="app-actions">
            <button id="btn-search-toggle" class="orb" type="button" aria-label="搜索与排序" aria-expanded="false" aria-controls="find-bar" title="搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
            </button>
            <button id="btn-menu" class="orb" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-sheet" title="更多">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
            </button>
          </div>
        </div>
      </header>

      <div id="pane-shelf" class="pane on" role="tabpanel" aria-label="流">
        <div class="measure">
          <div id="find-bar" class="find-bar" hidden>
            <div class="find-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
              <input id="search" type="search" placeholder="搜索标题或作者" enterkeyhint="search" aria-label="搜索标题或作者" autocomplete="off">
              <button id="search-chip" class="find-clear hidden" type="button" aria-label="清除搜索" title="清除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg></button>
            </div>
            <div id="sort-seg" class="sort-seg" role="radiogroup" aria-label="排序">
              <button type="button" data-sort="recent" role="radio">最近打开</button>
              <button type="button" data-sort="added" role="radio">最近加入</button>
              <button type="button" data-sort="title" role="radio">标题</button>
            </div>
          </div>
          <div id="import-status" class="status hidden"></div>
          <div id="empty" class="empty hidden">
            <div class="empty-glow" aria-hidden="true"></div>
            <p>这里还很安静</p>
            <p class="hint">导入 EPUB、PDF 或 TXT，它们会出现在这里。</p>
            <button id="btn-empty-import" class="pill accent" type="button">导入</button>
          </div>
          <div id="no-match" class="empty compact hidden"><p>没有找到</p></div>
          <p id="shelf-sub" class="shelf-sub"></p>
          <div id="grid" class="book-list" role="list" aria-label="流"></div>
          <footer id="storage-info" class="foot"></footer>
        </div>
      </div>

      <div id="pane-knowledge" class="pane" role="tabpanel" aria-label="知识">
        <div class="measure">
          <div class="pane-head">
            <h2>知识</h2>
            <div class="head-actions">
              <button id="btn-export-notes" class="orb small" type="button" aria-label="复制大纲" title="复制大纲">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 7h10M9.5 12h10M9.5 17h10"/><path d="M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>
              </button>
              <button id="btn-new-decision" class="orb small" type="button" aria-label="写一次判断" title="写一次判断">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v15M8 19.5h8M5.5 8h13"/><path d="M5.5 8l-2.6 5.6a2.6 2.6 0 0 0 5.2 0z"/><path d="M18.5 8l-2.6 5.6a2.6 2.6 0 0 0 5.2 0z"/></svg>
              </button>
              <button id="btn-new-note" class="pill accent" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg><span>新建笔记</span>
              </button>
            </div>
          </div>
          <div class="k-tools">
            <div class="find-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
              <input id="note-search" type="search" placeholder="搜索笔记、摘录或标签" aria-label="搜索笔记" autocomplete="off">
            </div>
            <div id="tag-filters" class="chips"></div>
          </div>
          <div id="note-list" class="note-list"></div>
        </div>
        <div id="note-editor" class="editor hidden"></div>
      </div>

      <div id="pane-graph" class="pane" role="tabpanel" aria-label="星海">
        <div class="pane-head">
          <h2 id="graph-title">星海</h2>
          <div class="zoom-ctl" aria-label="缩放">
            <button id="graph-out" type="button" aria-label="缩小">−</button>
            <button id="graph-reset" type="button">适应</button>
            <button id="graph-in" type="button" aria-label="放大">+</button>
          </div>
        </div>
        <div class="graph-search-row find-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
          <input id="graph-search" type="search" placeholder="找一个概念或笔记" aria-label="在星海中查找" autocomplete="off">
        </div>
        <div id="graph-stage" class="graph-stage">
          <div id="graph-world" class="graph-world"></div>
          <div id="graph-empty" class="graph-empty">
            <p>星海还是暗的</p>
            <p>写下两条笔记并连起来，它们会在这里亮起。</p>
          </div>
          <div class="legend" aria-hidden="true"><span><i class="lg link"></i>关联</span><span><i class="lg tag"></i>同标签</span></div>
        </div>
        <aside id="graph-card" class="graph-card hidden"></aside>
      </div>
    </div>
  </div>
  <nav class="tabbar" aria-label="切换视图">
    <button type="button" data-pane="shelf" role="tab" class="on" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7.5h15M4.5 12h10.5M4.5 16.5h6.5"/></svg>
      <span>流</span>
    </button>
    <button type="button" data-pane="knowledge" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8h7.6l4.6 4.6V19.4a.8.8 0 0 1-.8.8H7a.8.8 0 0 1-.8-.8V4.6a.8.8 0 0 1 .8-.8z"/><path d="M14.4 3.8v4.8h4.8"/><path d="M9 13h6.5M9 16.4h4"/></svg>
      <span>知识</span>
    </button>
    <button type="button" data-pane="graph" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5l1.5 4.6 4.6 1.5-4.6 1.5L11 15.7l-1.5-4.6-4.6-1.5 4.6-1.5z"/><path d="M18 15.2l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6z"/><path d="M5.5 18.6h.01"/></svg>
      <span>星海</span>
    </button>
  </nav>
  <div id="pick-bar" class="pick-bar" role="toolbar" aria-label="整理" hidden>
    <span id="manage-count" class="pick-count" aria-live="polite"></span>
    <button id="btn-stack-picked" type="button">建堆</button>
    <button id="btn-unstack-picked" class="hidden" type="button">移出</button>
    <button id="btn-delete-picked" class="danger" type="button">删除</button>
    <button id="btn-done-picked" class="done" type="button">完成</button>
  </div>
</section>

<section id="reader" class="view">
  <div class="run run-top" id="run-title"></div>
  <div id="stage"><div id="viewer"></div><div id="tap"></div></div>
  <aside id="bilingual" class="bilingual hidden" aria-label="中英对照">
    <div class="bi-head"><span>中英对照</span><button id="btn-bi-off" type="button">只看原文</button></div>
    <div id="bi-body"></div>
  </aside>
  <div class="run run-bottom" id="run-pct"></div>
  <div id="bars" class="hidden">
    <header class="rbar top">
      <button id="btn-back" class="icon" type="button" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="r-title" class="rtitle"></div>
      <button id="btn-select" class="icon" type="button" aria-label="选择文字"><svg viewBox="0 0 24 24"><path d="M4 20l3.2-.8L18.5 8a1.8 1.8 0 0 0-2.5-2.5L4.7 16.8 4 20z"/><path d="M13.5 6.5l4 4"/></svg></button>
      <button id="btn-bm" class="icon star" type="button" aria-label="书签">☆</button>
    </header>
    <footer class="rbar bottom">
      <div class="progress-row"><span id="r-pos"></span><input id="r-slider" type="range" min="0" max="1000" value="0"><span id="r-pct">0%</span></div>
      <div class="btn-row">
        <button id="btn-toc" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>目录</span></button>
        <button id="btn-bms" type="button"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.2L7 20z"/></svg><span>书签</span></button>
        <button id="btn-hls" type="button"><svg viewBox="0 0 24 24"><path d="M5 19l3.2-.7L18.2 8.3a1.6 1.6 0 0 0-2.3-2.3L5.9 16.1 5 19z"/><path d="M4 21h16"/></svg><span>划线</span></button>
        <button id="btn-aa" type="button"><b class="aa">Aa</b><span>排版</span></button>
      </div>
    </footer>
    <div id="settings" class="sheet hidden"></div>
  </div>
  <div id="loading" class="loading hidden">正在打开…</div>
  <div id="select-bar" class="selectbar hidden">
    <p id="select-hint">拖动选择文字，或长按一段</p>
    <div class="select-actions">
      <button id="btn-hl" type="button">划线</button>
      <button id="btn-annotate" type="button">批注</button>
      <button id="btn-excerpt" type="button">摘录</button>
      <button id="btn-ai" type="button">AI解释</button>
      <button id="btn-copy" type="button">复制</button>
      <button id="btn-select-done" type="button">完成</button>
    </div>
  </div>
  <div id="panel" class="panel hidden">
    <div class="panel-head"><span id="panel-title"></span><button id="panel-close" class="icon" type="button" aria-label="关闭">×</button></div>
    <div id="panel-body"></div>
  </div>
</section>

<div id="lib-panel" class="lib-panel hidden">
  <div class="panel-head"><span id="lib-title">摘录</span><button id="lib-close" class="icon" type="button" aria-label="关闭">×</button></div>
  <div id="lib-body"></div>
</div>
<div id="note-mask" class="note-mask hidden">
  <form id="note-dialog" class="note-dialog">
    <h3 id="note-heading">保存摘录</h3>
    <p id="note-quote" class="quote"></p>
    <textarea id="note-text" rows="3" placeholder="写一句笔记，也可以留空"></textarea>
    <input id="note-tags" type="text" placeholder="标签，用空格分开，可以留空" autocomplete="off">
    <div class="note-actions">
      <button type="button" id="note-cancel">取消</button>
      <button type="submit" class="btn primary" id="note-save">保存</button>
    </div>
  </form>
</div>
<div id="ai-mask" class="note-mask hidden">
  <div class="note-dialog ai-dialog" role="dialog" aria-labelledby="ai-title">
    <h3 id="ai-title">AI 解释</h3>
    <p id="ai-quote" class="quote"></p>
    <div id="ai-body"></div>
    <form id="ai-ask" class="ai-ask">
      <input id="ai-q" type="text" placeholder="围绕这段文字提问" autocomplete="off">
      <button class="btn primary" type="submit">提问</button>
    </form>
    <div class="note-actions">
      <button type="button" id="ai-close">关闭</button>
      <button type="button" id="ai-save" class="btn primary">存为笔记</button>
    </div>
  </div>
</div>
<div id="settings-mask" class="note-mask hidden">
  <form id="ai-settings" class="note-dialog">
    <h3>AI 设置</h3>
    <p class="desk-note">兼容 OpenAI 的聊天接口。密钥只存在这台设备上。</p>
    <label class="field">接口地址<input id="ai-base" type="url" placeholder="https://api.openai.com/v1" autocomplete="off"></label>
    <label class="field">模型<input id="ai-model" type="text" placeholder="gpt-4o-mini" autocomplete="off"></label>
    <label class="field">密钥<input id="ai-key" type="password" autocomplete="off" placeholder="只保存在这台设备"></label>
    <p id="ai-settings-status" class="desk-note"></p>
    <div class="note-actions">
      <button type="button" id="ai-settings-clear">清除密钥</button>
      <button type="button" id="ai-settings-test">测试</button>
      <button type="button" id="ai-settings-cancel">关闭</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>
<div id="menu-mask" class="menu-mask hidden">
  <div id="menu-sheet" class="menu-sheet" role="menu" aria-label="更多">
    <button id="btn-import" class="menu-item" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v10.5M7.6 10.8 12 15.2l4.4-4.4"/><path d="M5 19.5h14"/></svg><span class="menu-label">导入</span></button>
    <button id="btn-select-mode" class="menu-item" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.6 12.2l2.3 2.3 4.5-4.8"/></svg><span class="menu-label">整理</span></button>
    <button id="btn-excerpts" class="menu-item" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 11h14M5 15.5h8"/><path d="M16 15.5l1.6 3 1.4-3"/></svg><span class="menu-label">摘录</span></button>
    <div class="menu-sep" role="separator"></div>
    <button id="btn-appearance" class="menu-item" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.6"/><path d="M12 4.4a7.6 7.6 0 0 1 0 15.2z" fill="currentColor" stroke="none"/></svg><span class="menu-label">外观</span></button>
    <button id="btn-ai-settings" class="menu-item" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l1.4 4.2 4.2 1.4-4.2 1.4L10 15.2 8.6 11 4.4 9.6 8.6 8.2z"/><path d="M17.4 13.6l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg><span class="menu-label">AI 设置</span></button>
  </div>
</div>
<input id="file-input" type="file" multiple hidden>
<div id="stack-mask" class="note-mask hidden">
  <form id="stack-dialog" class="note-dialog" role="dialog" aria-modal="true" aria-labelledby="stack-heading">
    <h3 id="stack-heading">建堆</h3>
    <p id="stack-desc" class="desk-note"></p>
    <label id="stack-target-field" class="field">放到<select id="stack-target"></select></label>
    <label id="stack-name-field" class="field">名称<input id="stack-name" type="text" maxlength="40" autocomplete="off" enterkeyhint="done"></label>
    <div class="note-actions">
      <button type="button" id="stack-cancel">取消</button>
      <button type="submit" class="btn primary" id="stack-save">完成</button>
    </div>
  </form>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
