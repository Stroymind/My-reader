<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Zone：苹果风个人移动端 AI Agent。">
<meta name="google" content="notranslate">
<title>Zone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
(function () {
  try {
    var p = localStorage.getItem('rr-appearance') || 'system';
    var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('appearance-dark');
    document.documentElement.dataset.appearance = p;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
</head>
<body class="theme-paper">
<section id="library" class="view active">
  <div class="shell">
    <div class="maincol">
      <h1 class="sr">Zone</h1>

      <div id="pane-shelf" class="pane on" role="tabpanel" aria-label="流">
        <div class="measure">
          <div id="find-bar" class="find-bar" hidden>
            <div class="find-row">
              <div class="find-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
                <input id="search" type="search" placeholder="搜索标题或作者" enterkeyhint="search" aria-label="搜索标题或作者" autocomplete="off">
                <button id="search-chip" class="find-clear hidden" type="button" aria-label="清除搜索" title="清除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg></button>
              </div>
              <button id="btn-find-close" class="find-done" type="button">完成</button>
            </div>
            <div id="sort-seg" class="sort-seg" role="radiogroup" aria-label="排序">
              <button type="button" data-sort="recent" role="radio">最近打开</button>
              <button type="button" data-sort="added" role="radio">最近加入</button>
              <button type="button" data-sort="title" role="radio">标题</button>
            </div>
          </div>
          <div id="import-status" class="status hidden"></div>
          <section id="zone-agent-hub" class="agent-hub" aria-label="Zone 智能体中枢">
            <div class="agent-top-acts">
              <button id="btn-hub-profile" class="agent-avatar-btn" type="button" aria-label="账号、API 用量与设置" title="用量与设置">Z</button>
              <button id="btn-hub-newbot" class="agent-icon-btn" type="button" aria-label="新建 Bot" title="新建 Bot">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <div class="agent-hero">
              <button id="zone-hero-card" class="agent-hero-card" type="button" aria-label="进入主 Bot 对话">
                <span id="zone-hero-glyph" class="agent-orb-glyph" aria-hidden="true"></span>
                <span id="zone-hero-name" class="agent-hero-name">Zone</span>
              </button>
            </div>
            <div id="zone-live-card" class="agent-live hidden" aria-live="polite"></div>
            <div id="zone-bot-roster" class="bot-roster hidden" aria-label="Bot 对话列表"></div>
            <div id="zone-microapp-strip" class="agent-apps hidden" aria-label="我的微应用"></div>
            <div class="agent-bottom-bar" aria-label="快捷入口">
              <button id="btn-hub-plugins" class="agent-icon-btn" type="button" aria-label="插件与定时任务" title="插件与定时任务">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><path d="M16.75 13.75v6M13.75 16.75h6"/></svg>
              </button>
              <label class="agent-search-pill">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
                <input id="zone-bot-search" type="search" placeholder="搜索" autocomplete="off" aria-label="搜索 Bot 或对话">
              </label>
            </div>
          </section>
          <div id="empty" class="empty empty-quiet hidden" aria-hidden="true">
            <button id="btn-empty-import" class="sr" type="button" tabindex="-1">导入</button>
          </div>
          <div id="no-match" class="empty compact hidden"><p>没有找到</p></div>
          <p id="shelf-sub" class="shelf-sub"></p>
          <div id="grid" class="book-list" role="list" aria-label="流"></div>
          <footer id="storage-info" class="foot"></footer>
        </div>
      </div>

      <div id="pane-knowledge" class="pane" role="tabpanel" aria-label="知识">
        <div class="measure">
          <h2 class="sr">知识</h2>
          <div id="k-find-bar" class="k-find-bar" hidden>
            <div class="find-row">
              <div class="find-field">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
                <input id="note-search" type="search" placeholder="搜索笔记、摘录或标签" aria-label="搜索笔记" autocomplete="off">
                <button id="note-search-clear" class="find-clear hidden" type="button" aria-label="清除搜索" title="清除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg></button>
              </div>
              <button id="btn-k-find-close" class="find-done" type="button">完成</button>
            </div>
            <div id="tag-filters" class="chips"></div>
          </div>
          <button id="k-filter-chip" class="active-filter-chip hidden" type="button"></button>
          <div id="note-list" class="note-list"></div>
        </div>
      </div>

      <div id="pane-graph" class="pane" role="tabpanel" aria-label="星海">
        <h2 id="graph-title" class="sr">星海</h2>
        <div id="graph-stage" class="graph-stage" tabindex="0" aria-label="星海画布：拖动平移，滚轮或双指缩放，双击适应全图，方向键平移，加减号缩放">
          <canvas id="graph-sky" class="graph-sky" aria-hidden="true"></canvas>
          <div id="graph-plane" class="graph-plane">
            <canvas id="graph-map" class="graph-map" aria-hidden="true"></canvas>
            <div id="graph-world" class="graph-world" role="group" aria-label="星体"></div>
          </div>
          <div id="graph-empty" class="graph-empty hidden">
            <p>星海尚未点亮</p>
            <p>写下第一条笔记，它会成为这里的第一颗星。</p>
          </div>
        </div>
        <div id="graph-search-row" class="hud-search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg>
          <input id="graph-search" type="search" placeholder="找一颗星或一个标签" aria-label="在星海中查找" autocomplete="off" enterkeyhint="search">
          <button id="btn-graph-search-close" class="hud-done" type="button">完成</button>
        </div>
        <aside id="graph-card" class="graph-card hidden" aria-live="polite"></aside>
      </div>
    </div>
  </div>
  <div id="space-whisper" class="space-whisper" aria-live="polite" aria-hidden="true">
    <span data-w="shelf">流</span>
    <span data-w="knowledge">知识</span>
    <span data-w="graph">星海</span>
  </div>
  <div id="spatial-dock" class="spatial-dock">
    <button id="spatial-bar" class="spatial-bar" type="button" aria-label="展开空间与操作" aria-haspopup="dialog" aria-expanded="false" aria-controls="intent-sheet" title="轻点或上滑打开操作，左右滑动切换空间">
      <span class="spatial-line" aria-hidden="true"></span>
    </button>
  </div>
  <div id="pick-bar" class="pick-bar" role="toolbar" aria-label="整理" hidden>
    <span id="manage-count" class="pick-count" aria-live="polite"></span>
    <button id="btn-stack-picked" type="button">建堆</button>
    <button id="btn-unstack-picked" class="hidden" type="button">移出</button>
    <button id="btn-delete-picked" class="danger" type="button">删除</button>
    <button id="btn-done-picked" class="done" type="button">完成</button>
  </div>
  <div id="note-editor" class="editor hidden"></div>
</section>

<section id="reader" class="view">
  <div class="run run-top" id="run-title"></div>
  <div id="stage"><div id="viewer"></div><div id="tap"></div></div>
  <aside id="bilingual" class="bilingual hidden" aria-label="中英对照">
    <div class="bi-head"><span>中英对照</span><button id="btn-bi-off" type="button">只看原文</button></div>
    <div id="bi-body"></div>
  </aside>
  <div class="run run-bottom" id="run-pct"></div>
  <button id="reader-cmd-bar" class="reader-cmd-bar" type="button" aria-label="语音或文字控制阅读" title="轻点或长按底线直接说出指令（Alt+Space）"><span class="reader-cmd-line" aria-hidden="true"></span></button>
  <div id="bars" class="hidden">
    <header class="rbar top">
      <button id="btn-back" class="icon" type="button" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="r-title" class="rtitle"></div>
      <span class="rbar-spacer" aria-hidden="true"></span>
    </header>
    <footer class="rbar bottom">
      <div class="progress-row"><span id="r-pos"></span><input id="r-slider" type="range" min="0" max="1000" value="0"><span id="r-pct">0%</span></div>
      <div class="btn-row">
        <button id="btn-toc" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>目录</span></button>
        <button id="btn-reader-voice" type="button"><svg viewBox="0 0 24 24"><path d="M5 12v0M9 8v8M12 5v14M15 8v8M19 12v0"/></svg><span>说一句</span></button>
      </div>
    </footer>
    <div id="settings" class="sheet hidden"></div>
  </div>
  <div id="loading" class="loading hidden">正在打开…</div>
  <div id="select-bar" class="selectbar hidden">
    <div class="select-actions">
      <button id="btn-hl" type="button">划线</button>
      <button id="btn-note" type="button">想法</button>
      <button id="btn-ai" type="button">问 AI</button>
    </div>
  </div>
  <div id="panel" class="panel hidden">
    <div class="panel-backdrop" id="panel-backdrop"></div>
    <div class="panel-sheet" role="dialog" aria-modal="true" aria-label="阅读索引">
      <div class="panel-grip" id="panel-grip" aria-hidden="true"></div>
      <div class="panel-head">
        <div id="panel-tabs" class="panel-tabs" role="tablist" aria-label="阅读索引">
          <button type="button" data-ptab="toc" role="tab" class="on" aria-selected="true">目录</button>
          <button type="button" data-ptab="bms" role="tab" aria-selected="false">书签</button>
          <button type="button" data-ptab="hls" role="tab" aria-selected="false">划线</button>
        </div>
        <span id="panel-title" class="sr">目录</span>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>
</section>

<div id="lib-panel" class="lib-panel hidden">
  <div class="panel-head"><span id="lib-title">摘录</span><button id="lib-close" class="icon" type="button" aria-label="关闭">×</button></div>
  <div id="lib-body"></div>
</div>
<div id="note-mask" class="note-mask hidden">
  <form id="note-dialog" class="note-dialog">
    <h3 id="note-heading">保存摘录</h3>
    <p id="note-quote" class="quote"></p>
    <textarea id="note-text" rows="3" placeholder="写一句笔记，也可以留空"></textarea>
    <input id="note-tags" type="text" placeholder="标签，用空格分开，可以留空" autocomplete="off">
    <div class="note-actions">
      <button type="button" id="note-cancel">取消</button>
      <button type="submit" class="btn primary" id="note-save">保存</button>
    </div>
  </form>
</div>
<div id="ai-mask" class="note-mask hidden">
  <div class="note-dialog ai-dialog" role="dialog" aria-labelledby="ai-title">
    <h3 id="ai-title">AI 解释</h3>
    <p id="ai-quote" class="quote"></p>
    <div id="ai-body"></div>
    <form id="ai-ask" class="ai-ask">
      <input id="ai-q" type="text" placeholder="围绕这段文字提问" autocomplete="off">
      <button class="btn primary" type="submit">提问</button>
    </form>
    <div class="note-actions">
      <button type="button" id="ai-close">关闭</button>
      <button type="button" id="ai-save" class="btn primary">存为笔记</button>
    </div>
  </div>
</div>
<div id="settings-mask" class="note-mask hidden">
  <form id="ai-settings" class="note-dialog">
    <h3>AI 设置</h3>
    <p class="desk-note">兼容 OpenAI 的聊天接口。密钥只存在这台设备上。</p>
    <label class="field">接口地址<input id="ai-base" type="url" placeholder="https://api.openai.com/v1" autocomplete="off"></label>
    <label class="field">模型<input id="ai-model" type="text" placeholder="gpt-4o-mini" autocomplete="off"></label>
    <label class="field">密钥<input id="ai-key" type="password" autocomplete="off" placeholder="只保存在这台设备"></label>
    <p id="ai-settings-status" class="desk-note"></p>
    <div class="note-actions">
      <button type="button" id="ai-settings-clear">清除密钥</button>
      <button type="button" id="ai-settings-test">测试</button>
      <button type="button" id="ai-settings-cancel">关闭</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>
<div id="intent-mask" class="intent-mask hidden">
  <div id="intent-sheet" class="intent-sheet" role="dialog" aria-modal="true" aria-label="空间与操作">
    <div class="intent-grip" aria-hidden="true"></div>
    <nav class="z-depth-track" role="tablist" aria-label="焦距穿层">
      <button type="button" data-pane="shelf" role="tab" class="on" aria-selected="true"><i aria-hidden="true"></i><span>流</span></button>
      <button type="button" data-pane="knowledge" role="tab" aria-selected="false"><i aria-hidden="true"></i><span>知识</span></button>
      <button type="button" data-pane="graph" role="tab" aria-selected="false"><i aria-hidden="true"></i><span>星海</span></button>
    </nav>
    <div class="intent-cmd-row">
      <button id="intent-cmd-btn" class="intent-cmd-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12v0M9 8.5v7M12 6v12M15 8.5v7M19 12v0"/></svg>
        <span>说一句直接做，如「探索星海」「记个想法」</span>
      </button>
      <button id="intent-mic" class="intent-mic" type="button" aria-label="语音指令" title="直接说话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4" width="6" height="10" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.2M9 20.2h6"/></svg>
      </button>
    </div>
    <div class="intent-grid" role="menu" aria-label="操作">
      <button id="btn-import" class="menu-item intent-tile" data-for="shelf" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v10.5M7.6 10.8 12 15.2l4.4-4.4"/><path d="M5 19.5h14"/></svg><span class="menu-label">导入</span></button>
      <button id="btn-new-note" class="menu-item intent-tile" data-for="knowledge graph" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg><span class="menu-label">新建笔记</span></button>
      <button id="btn-intent-search" class="menu-item intent-tile" data-for="shelf knowledge graph" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/></svg><span class="menu-label">搜索</span></button>
    </div>
    <div class="intent-foot" role="menu" aria-label="偏好">
      <button id="btn-auth-account" class="menu-item intent-sub" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg><span class="menu-label" id="intent-auth-label">登录 / 账号</span></button>
      <button id="btn-ai-settings" class="menu-item intent-sub" role="menuitem" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l1.4 4.2 4.2 1.4-4.2 1.4L10 15.2 8.6 11 4.4 9.6 8.6 8.2z"/><path d="M17.4 13.6l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/></svg><span class="menu-label">AI 设置</span></button>
    </div>
    <button id="btn-intent-return-bot" class="intent-return-bot" type="button">返回对话</button>
  </div>
</div>
<input id="file-input" type="file" multiple hidden>
<div id="stack-mask" class="note-mask hidden">
  <form id="stack-dialog" class="note-dialog" role="dialog" aria-modal="true" aria-labelledby="stack-heading">
    <h3 id="stack-heading">建堆</h3>
    <p id="stack-desc" class="desk-note"></p>
    <label id="stack-target-field" class="field">放到<select id="stack-target"></select></label>
    <label id="stack-name-field" class="field">名称<input id="stack-name" type="text" maxlength="40" autocomplete="off" enterkeyhint="done"></label>
    <div class="note-actions">
      <button type="button" id="stack-cancel">取消</button>
      <button type="submit" class="btn primary" id="stack-save">完成</button>
    </div>
  </form>
</div>
<div id="peek-mask" class="peek-mask hidden">
  <article id="peek-card" class="peek-card" role="dialog" aria-modal="true" aria-labelledby="peek-title">
    <div class="peek-head">
      <div id="peek-cover" class="peek-cover"></div>
      <div class="peek-meta">
        <span id="peek-kicker" class="peek-kicker"></span>
        <h3 id="peek-title" class="peek-title"></h3>
        <p id="peek-sub" class="peek-sub"></p>
      </div>
      <button id="peek-close" class="peek-close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg></button>
    </div>
    <p id="peek-body" class="peek-body"></p>
    <blockquote id="peek-quote" class="peek-quote hidden"></blockquote>
    <div class="peek-actions">
      <button id="peek-open" class="btn primary" type="button">继续阅读</button>
    </div>
  </article>
</div>
<div id="command-mask" class="command-mask hidden">
  <div id="command-bar" class="command-bar" role="dialog" aria-modal="true" aria-label="自然指令与语音控制">
    <form id="command-form" class="command-form">
      <button id="cmd-mic" class="cmd-mic" type="button" aria-label="开始或停止语音输入" aria-pressed="false">
        <span class="cmd-wave" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <input id="cmd-input" type="text" placeholder="说一句即可，如「把第2行划线」「探索星海」" aria-label="输入或说出指令" autocomplete="off" enterkeyhint="go">
      <button id="cmd-wake" class="cmd-wake" type="button" aria-pressed="false" title="开启后可直接说「Zone…」唤醒">唤醒</button>
    </form>
  </div>
</div>
<div id="drag-trash-zone" class="drag-trash-zone hidden" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 12a1 1 0 0 0 1 .9h6a1 1 0 0 0 1-.9l1-12"/></svg>
  <span id="drag-trash-label">拖到这里移除</span>
</div>
<div id="auth-gate" class="auth-gate hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <div class="auth-portal" id="auth-portal" tabindex="0" role="button" aria-label="轻触进入 Zone">
    <div class="auth-ring" aria-hidden="true"></div>
    <div class="auth-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="76" height="76">
        <path d="M42 16 C46 9 54 9 58 16 L86 67 C91 76 85 86 75 86 H25 C15 86 9 76 14 67 Z" fill="#111111" stroke="none"/>
        <rect x="41" y="49" width="7.2" height="17" rx="3.6" fill="#FFFFFF" stroke="none"/>
        <rect x="57" y="49" width="7.2" height="17" rx="3.6" fill="#FFFFFF" stroke="none"/>
      </svg>
    </div>
    <h2 id="auth-title" class="auth-title">Zone</h2>
    <p class="auth-whisper">个人移动端智能体 · 轻触进入</p>
  </div>
  <p class="auth-pledge">本机加密存储 · 隐私归你所有</p>
</div>
<div id="confirm-mask" class="confirm-mask hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="confirm-sheet">
    <div class="intent-grip" aria-hidden="true"></div>
    <h3 id="confirm-title" class="confirm-title"></h3>
    <p id="confirm-sub" class="confirm-sub hidden"></p>
    <div class="confirm-actions">
      <button type="button" id="confirm-cancel" class="confirm-cancel">先留着</button>
      <button type="button" id="confirm-ok" class="confirm-ok">确认移除</button>
    </div>
  </div>
</div>
<div id="eye-rest-mask" class="eye-rest-mask hidden" role="dialog" aria-modal="true" aria-label="护眼远眺小憩">
  <div class="eye-rest-orb" aria-hidden="true"></div>
  <p class="eye-rest-title">望向远处，让眼睛松一口气</p>
  <p class="eye-rest-sub" id="eye-rest-count">20s · 轻触任意处返回</p>
</div>
<div id="sichao-mask" class="sichao-mask hidden" role="dialog" aria-modal="true" aria-label="思潮 · 独立判断训练">
  <div class="sichao-sheet">
    <div class="intent-grip" aria-hidden="true"></div>
    <div id="sichao-body" class="sichao-body"></div>
  </div>
</div>
<section id="zone-chat-modal" class="bot-chat-view hidden" role="dialog" aria-modal="true" aria-label="Bot 对话">
  <header class="bot-chat-bar">
    <button id="btn-chat-back" class="bot-chat-back" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="btn-chat-botmeta" class="bot-chat-who" type="button" title="定制形象与规则">
      <span id="chat-head-av" class="bot-chat-av" aria-hidden="true"></span>
      <span id="chat-head-name" class="bot-chat-name">Zone</span>
    </button>
    <div class="bot-chat-right">
      <button id="btn-chat-new" class="bot-chat-pill" type="button">新话题</button>
    </div>
  </header>
  <div id="zone-chat-plugins-bar" class="bot-mounted-bar hidden" aria-label="当前 Bot 已加载插件"></div>
  <div id="zone-chat-messages" class="bot-chat-messages" aria-live="polite"></div>
  <form id="zone-chat-form" class="bot-chat-foot">
    <div class="agent-capsule">
      <button id="btn-chat-plugins" class="chat-plus-btn" type="button" aria-label="在当前 Bot 加载插件" title="为当前 Bot 加载或管理插件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="zone-chat-input" type="text" placeholder="发消息，或直接说话…" autocomplete="off" enterkeyhint="send" aria-label="发消息给 Bot">
      <button id="zone-chat-mic" class="agent-mic" type="button" aria-label="语音输入" title="直接说话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4" width="6" height="10" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3.2M9 20.2h6"/></svg>
      </button>
    </div>
  </form>
</section>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
