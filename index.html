<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<title>我的书房</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
</head>
<body class="theme-day">
<!-- 书架：第一页只看书，向左滑到整理 -->
<section id="library" class="view active">
  <div id="pager" class="pager">
    <div class="sheet-page" id="shelf-page">
      <div class="sheet-scroll" id="shelf-scroll">
        <button id="search-chip" class="search-chip hidden" type="button"></button>
        <div id="empty" class="empty hidden">
          <p>书架还是空的</p>
          <p class="hint">向左滑，可以导入 EPUB、PDF、TXT、HTML，或装着许多书的 ZIP。导入后可离线阅读。</p>
        </div>
        <div id="no-match" class="empty hidden"><p>没有匹配的书</p></div>
        <div id="grid" class="grid"></div>
      </div>
    </div>
    <div class="sheet-page" id="desk-page">
      <div class="sheet-scroll">
        <header class="topbar">
          <h1>整理</h1>
        </header>
        <section class="desk-block">
          <h2>搜索</h2>
          <input id="search" type="search" placeholder="搜索书名或作者" enterkeyhint="search">
        </section>
        <section class="desk-block">
          <h2>排序</h2>
          <div id="sort-seg" class="sort-seg" role="radiogroup" aria-label="排序">
            <button type="button" data-sort="recent" role="radio">最近阅读</button>
            <button type="button" data-sort="added" role="radio">最近导入</button>
            <button type="button" data-sort="title" role="radio">书名</button>
          </div>
        </section>
        <section class="desk-block">
          <h2>导入</h2>
          <label class="btn primary desk-btn" for="file-input">导入书籍</label>
          <input id="file-input" type="file" multiple hidden>
          <p class="desk-note">可一次选择多个 EPUB、PDF、TXT、HTML，或 ZIP 压缩包。</p>
          <div id="import-status" class="status hidden"></div>
        </section>
        <section class="desk-block">
          <h2>摘录</h2>
          <button id="btn-excerpts" class="desk-row" type="button">查看全部摘录</button>
        </section>
        <section class="desk-block">
          <h2>删除</h2>
          <p class="desk-note">点一下要删的书。没点到的书保持原样。在书架上长按封面，也可以直接删一本。</p>
          <div id="desk-list" class="desk-list"></div>
          <div id="manage-bar" class="manage-bar hidden">
            <span id="manage-count"></span>
            <button id="btn-delete-picked" type="button">删除所选</button>
          </div>
        </section>
        <footer id="storage-info" class="foot"></footer>
      </div>
    </div>
  </div>
  <div class="dots" aria-hidden="true">
    <button class="dot on" type="button" data-page="0" aria-label="书架"></button>
    <button class="dot" type="button" data-page="1" aria-label="整理"></button>
  </div>
</section>

<!-- 阅读器 -->
<section id="reader" class="view">
  <div class="run run-top" id="run-title"></div>
  <div id="stage"><div id="viewer"></div><div id="tap"></div></div>
  <div class="run run-bottom" id="run-pct"></div>
  <div id="bars" class="hidden">
    <header class="rbar top">
      <button id="btn-back" class="icon" aria-label="返回书架"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="r-title" class="rtitle"></div>
      <button id="btn-select" class="icon" aria-label="选择文字"><svg viewBox="0 0 24 24"><path d="M4 20l3.2-.8L18.5 8a1.8 1.8 0 0 0-2.5-2.5L4.7 16.8 4 20z"/><path d="M13.5 6.5l4 4"/></svg></button>
      <button id="btn-bm" class="icon star" aria-label="书签">☆</button>
    </header>
    <footer class="rbar bottom">
      <div class="progress-row"><span id="r-pos"></span><input id="r-slider" type="range" min="0" max="1000" value="0"><span id="r-pct">0%</span></div>
      <div class="btn-row">
        <button id="btn-toc"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>目录</span></button>
        <button id="btn-bms"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg><span>书签</span></button>
        <button id="btn-hls"><svg viewBox="0 0 24 24"><path d="M5 19l3.2-.7L18.2 8.3a1.6 1.6 0 0 0-2.3-2.3L5.9 16.1 5 19z"/><path d="M4 21h16"/></svg><span>划线</span></button>
        <button id="btn-aa"><b class="aa">Aa</b><span>排版</span></button>
      </div>
    </footer>
    <div id="settings" class="sheet hidden"></div>
  </div>
  <div id="loading" class="loading hidden">正在打开…</div>
  <div id="select-bar" class="selectbar hidden">
    <p id="select-hint">拖动选择文字，或长按一段</p>
    <div class="select-actions">
      <button id="btn-hl" type="button">高亮</button>
      <button id="btn-copy" type="button">复制</button>
      <button id="btn-excerpt" type="button">摘录</button>
      <button id="btn-select-done" type="button">完成</button>
    </div>
  </div>
  <div id="panel" class="panel hidden">
    <div class="panel-head"><span id="panel-title"></span><button id="panel-close" class="icon" aria-label="关闭">×</button></div>
    <div id="panel-body"></div>
  </div>
</section>
<div id="lib-panel" class="lib-panel hidden">
  <div class="panel-head"><span id="lib-title">摘录</span><button id="lib-close" class="icon" aria-label="关闭">×</button></div>
  <div id="lib-body"></div>
</div>
<div id="note-mask" class="note-mask hidden">
  <form id="note-dialog" class="note-dialog">
    <h3>保存摘录</h3>
    <p id="note-quote" class="quote"></p>
    <textarea id="note-text" rows="3" placeholder="写一句笔记，也可以留空"></textarea>
    <div class="note-actions">
      <button type="button" id="note-cancel">取消</button>
      <button type="submit" class="btn primary" id="note-save">保存</button>
    </div>
  </form>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
